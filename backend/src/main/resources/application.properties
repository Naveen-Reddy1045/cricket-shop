spring.application.name=cricketshop

# Server port (Render sets PORT env variable)
server.port=${PORT:8080}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cricketshop}
# On Render: SPRING_DATASOURCE_USERNAME must be 'avnadmin' (Aiven's default user, NOT 'root')
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD: hKyxlKQsbBkYpBioHxhEjIHaTbGOjVoy}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP - fail fast with a clear error instead of a long timeout
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# Temporary: expose the REAL connection error behind the Hibernate dialect wrapper
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.pool=DEBUG
logging.level.org.hibernate.engine.jdbc.env=DEBUG

# In-memory Spring Security user removed — JWT-based auth is used instead

spring.app.secretKey=${JWT_SECRET_KEY}
spring.app.jwtExpiration=${JWT_EXPIRATION:3600000}

java.runtime.version=25

# CORS configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://cricket-shop-snowy.vercel.app}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary (cloud image storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}