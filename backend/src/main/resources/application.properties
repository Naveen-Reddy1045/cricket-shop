spring.application.name=cricketshop


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD: hKyxlKQsbBkYpBioHxhEjIHaTbGOjVoy}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# In-memory Spring Security user removed — JWT-based auth is used instead

spring.app.secretKey=${JWT_SECRET_KEY}
spring.app.jwtExpiration=${JWT_EXPIRATION:3600000}

java.runtime.version=25

# CORS configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://cricket-shop-production.up.railway.app,https://cricket-shop-snowy.vercel.app}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB